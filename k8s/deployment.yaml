apiVersion: apps/v1
kind: Deployment
metadata:
  name: citadella-game
  labels:
    app: citadella-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citadella-game
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: citadella-game
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: citadella-game
          image: citadella-game:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8106
          env:
            - name: PORT
              value: "8106"
            - name: BASE_PATH
              value: "/citadella"
            - name: REDIS_URL
              value: "redis://redis-service:6379"
            - name: SESSION_TTL_SECONDS
              value: "21600"
          readinessProbe:
            httpGet:
              path: /citadella/api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 40m
              memory: 80Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
