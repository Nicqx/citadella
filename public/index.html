<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171d27">
  <title>Citadella – Játékszoba</title>
  <link rel="stylesheet" href="/citadella/style.css?v=activity-mobile-20261118">
  <script src="/citadella/app.js?v=activity-mobile-20261118" defer></script>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <button id="help-button" class="help-button hidden" type="button" aria-label="Játékszabály és kártyasegédlet">?</button>
  <dialog id="help-dialog" class="help-dialog">
    <div class="dialog-head">
      <div><p class="eyebrow">Játékszabály</p><h2>Szabályok és kártyák</h2></div>
      <button id="help-close" class="icon-button" type="button" aria-label="Bezárás">×</button>
    </div>
    <div id="help-list" class="help-list"></div>
  </dialog>
  <dialog id="activity-dialog" class="activity-dialog" aria-labelledby="activity-title">
    <h2 id="activity-title">Ellenfelek lépései</h2>
    <p class="muted">Az előző megtekintés óta lezárt karakterkörök.</p>
    <div id="activity-content" class="activity-content"></div>
    <button type="button" id="activity-ack">Rendben, láttam</button>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
