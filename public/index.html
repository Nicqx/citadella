<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171d27">
  <title>Citadella – Játékszoba</title>
  <link rel="stylesheet" href="/citadella/style.css">
  <script src="/citadella/app.js" defer></script>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <button id="help-button" class="help-button hidden" type="button" aria-label="Karaktersegédlet">?</button>
  <dialog id="help-dialog" class="help-dialog">
    <div class="dialog-head">
      <div><p class="eyebrow">Gyorssegédlet</p><h2>Karakterek</h2></div>
      <button id="help-close" class="icon-button" type="button" aria-label="Bezárás">×</button>
    </div>
    <div id="help-list" class="help-list"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
